apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bnone-ingress
  namespace: bnone-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - bnone.bookingnetwork.com
        - admin.bnone.bookingnetwork.com
        - api.bnone.bookingnetwork.com
      secretName: bnone-tls-cert
  rules:
    # User Web
    - host: bnone.bookingnetwork.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bnone-web-svc
                port:
                  number: 80

    # API
    - host: api.bnone.bookingnetwork.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bnone-api-svc
                port:
                  number: 8080

    # Admin Console
    - host: admin.bnone.bookingnetwork.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bnone-admin-svc
                port:
                  number: 80

