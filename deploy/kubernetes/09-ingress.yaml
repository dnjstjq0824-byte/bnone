apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moa-ingress
  namespace: moa-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - moa.bookingnetwork.com
        - admin.moa.bookingnetwork.com
        - api.moa.bookingnetwork.com
      secretName: moa-tls-cert
  rules:
    # User Web
    - host: moa.bookingnetwork.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moa-web-svc
                port:
                  number: 80

    # API
    - host: api.moa.bookingnetwork.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moa-api-svc
                port:
                  number: 8080

    # Admin Console
    - host: admin.moa.bookingnetwork.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moa-admin-svc
                port:
                  number: 80

