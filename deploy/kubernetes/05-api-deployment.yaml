apiVersion: apps/v1
kind: Deployment
metadata:
  name: moa-api
  namespace: moa-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moa-api
  template:
    metadata:
      labels:
        app: moa-api
    spec:
      containers:
        - name: api
          image: ghcr.io/dnjstjq0824-byte/moa-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: moa-config
            - secretRef:
                name: moa-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: moa-api-svc
  namespace: moa-prod
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: moa-api

