apiVersion: apps/v1
kind: Deployment
metadata:
  name: moa-worker
  namespace: moa-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moa-worker
  template:
    metadata:
      labels:
        app: moa-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/dnjstjq0824-byte/moa-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: moa-config
            - secretRef:
                name: moa-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

