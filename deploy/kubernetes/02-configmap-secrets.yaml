apiVersion: v1
kind: ConfigMap
metadata:
  name: bnone-config
  namespace: bnone-prod
data:
  PORT: "8080"
  LOG_LEVEL: "info"
  BASE_CURRENCY: "KRW"
  DATABASE_URL: "postgres://bnone:bnone_secret@postgres-service:5432/bnone_db?sslmode=disable"
  REDIS_URL: "redis://redis-service:6379/0"
  MIGRATIONS_PATH: "/app/migrations"
  FIXTURES_PATH: "/app/fixtures"
---
apiVersion: v1
kind: Secret
metadata:
  name: bnone-secrets
  namespace: bnone-prod
type: Opaque
stringData:
  JWT_SECRET: "bnone-production-grade-256bit-secure-key-bookingnetwork"
  POSTGRES_PASSWORD: "bnone_secret"

