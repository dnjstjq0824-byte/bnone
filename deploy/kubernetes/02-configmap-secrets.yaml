apiVersion: v1
kind: ConfigMap
metadata:
  name: moa-config
  namespace: moa-prod
data:
  PORT: "8080"
  LOG_LEVEL: "info"
  BASE_CURRENCY: "KRW"
  DATABASE_URL: "postgres://moa:moa_secret@postgres-service:5432/moa_db?sslmode=disable"
  REDIS_URL: "redis://redis-service:6379/0"
  MIGRATIONS_PATH: "/app/migrations"
  FIXTURES_PATH: "/app/fixtures"
---
# Production secrets MUST be injected by an external secret manager
# (External Secrets Operator, Sealed Secrets, or Vault) and never committed
# with real values. Replace the placeholders below via your secret pipeline
# before applying this manifest.
apiVersion: v1
kind: Secret
metadata:
  name: moa-secrets
  namespace: moa-prod
  annotations:
    moa/managed-by: external-secrets
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_MIN_32_CHARS_EXTERNAL_SECRET"
  POSTGRES_PASSWORD: "REPLACE_ME_EXTERNAL_SECRET"

